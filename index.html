<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite im Aufbau</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 500px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .date {
      font-weight: bold;
      font-size: 1.4rem;
      color: #ffd700;
    }

    .loader {
      margin: 30px auto;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #ffd700;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚧 Webseite im Aufbau 🚧</h1>
    <p>Unsere Webseite wird gerade erstellt.</p>
    <p>Wir arbeiten intensiv daran, Ihnen bald etwas Großartiges zu präsentieren.</p>
    <p>Startdatum:</p>
    <p class="date">01.07.2026</p>

    <div class="loader"></div>

    <footer>
      © 2026 – Alle Rechte vorbehalten
    </footer>
  </div>
</body>
</html>
